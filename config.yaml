# config.yaml — v1.1 OOM-resistant baseline
# Hardware target: Google Colab, 12 GB RAM
# Sensor: Livox MID-360, ~2 cm ranging accuracy
# Scene: long gallery cave, ~171 m bounding box, 26.5M raw points

# ── Voxel downsampling ────────────────────────────────────────────────────────
# Do NOT go below 0.05 m on a 12 GB Colab: normal estimation's KD-tree
# grows super-linearly with point count and will OOM around 4–5M points.
downsampling:
  voxel_size: 0.25
  chunk_size: 4000000 # Downsampling size of point chunks processed for each iteration

# ── Normal estimation ─────────────────────────────────────────────────────────
#
# Justification for knn: 20
# ─────────────────────────
# PCA normal estimation quality plateaus quickly with neighbour count.
# knn=20 gives stable normals at 0.08 m spacing (neighbourhood radius
# is roughly 2–3 × voxel_size, well within the cave wall curvature scale).
# knn=30 (original) uses 50% more memory for the neighbour index with no
# meaningful accuracy improvement at this point density.
#
# radius_search is intentionally absent: KNN with a fixed count is more
# memory-predictable than radius search, which can return unbounded
# neighbour counts in dense regions and spike memory unpredictably.
normals:
  knn: 15                       # neighbours  (was 30 — reduced for OOM safety)
  orient_toward_origin: true

# ── Mesh reconstruction ───────────────────────────────────────────────────────
reconstruction:
  algorithm: alpha_shape        # alpha_shape | ball_pivoting

  # Alpha Shapes
  # Justification for alpha: 0.20 m
  # ────────────────────────────────
  # At 0.08 m voxel size, the average nearest-neighbour distance is ~0.08–
  # 0.12 m. Alpha must be at least 1.5–2× that to triangulate flat surfaces
  # without holes → 0.16–0.18 m minimum.
  # 0.20 m adds a small safety margin for uneven wall surfaces while staying
  # well below the minimum squeeze width (~0.25–0.30 m), so the algorithm
  # will not bridge gaps.
  alpha_shape:
    alpha: 0.75                 # metres  (was 0.15 — adjusted for 0.08m voxel)

  # Ball Pivoting
  # Justification for radii
  # ───────────────────────
  # Smallest radius (0.08 m) matches voxel size — fills fine-scale detail.
  # Middle radius (0.16 m) covers surface-scale gaps between voxel clusters.
  # Largest radius (0.30 m) stays below minimum squeeze width so the ball
  # cannot roll across a passage even at maximum reach.
  ball_pivoting:
    radii: [0.25, 0.50, 1.00]  # metres  (rescaled from [0.05, 0.1, 0.2])

# ── Mesh Smoothing ────────────────────────────────────────────────────────────
smoothing:
  enabled: true
  iterations: 15                
# ── Post-reconstruction edge-length filter ────────────────────────────────────
#
# Justification for max_edge_length: 0.40 m
# ──────────────────────────────────────────
# 5× voxel_size (5 × 0.08 = 0.40 m). Triangles legitimate for a cave wall
# surface will span at most 2–3 voxel widths (~0.24 m). Any triangle with
# an edge longer than 0.40 m is almost certainly bridging a gap or reaching
# across a low-density region and should be culled.
edge_filter:
  enabled: true
  max_edge_length: 2.00         # metres  (was 0.50 — tightened proportionally)

# ── Output ────────────────────────────────────────────────────────────────────
output:
  save_mesh: true
  mesh_filename: output_mesh.ply
